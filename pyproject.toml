[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "signlab"
dynamic = ["version"]
description = "Reproducible hand-gesture recognition research and browser inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Bucci" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["typer>=0.27.1,<0.28"]

[project.urls]
Homepage = "https://github.com/peterbucci/signlab"
Issues = "https://github.com/peterbucci/signlab/issues"
Repository = "https://github.com/peterbucci/signlab"

[project.scripts]
signlab = "signlab.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling==1.32.0",
  "mypy>=2.3.1,<2.4",
  "pre-commit>=4.6.2,<5",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff==0.16.3",
]

[tool.hatch.version]
path = "src/signlab/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/signlab"]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.6"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["signlab"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
files = ["src", "scripts", "tests"]
mypy_path = "src"
pretty = true
python_version = "3.12"
show_error_codes = true
strict = true
warn_unused_configs = true

[tool.pytest]
minversion = "9.1"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=signlab",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "golden: cross-runtime or immutable-output regression tests",
  "integration: tests spanning process, filesystem, or database boundaries",
  "slow: tests excluded from the fast pull-request path",
]

[tool.coverage.run]
branch = true
source = ["signlab"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
show_missing = true
skip_covered = true
